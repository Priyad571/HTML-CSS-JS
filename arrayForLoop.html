<html>
    <body>
        <p id="arr"></p>
        <script>
            const fruits=["apple","orange","banana","papaya"];
            let flength=fruits.length;
            let text="<u1>";
            for(let i=0;i<flength;i++){
                text+="<li>"+fruits[i]+"</li>";
            }
            text+="</u1>";
            document.getElementById("arr").innerHTML=text;
        </script>
    </body>
</html>
